<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foggy Fights | Doku</title>
    <style>
        /* Grund-Setup für Mobile */
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* Verhindert das seitliche Wackeln */
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* INTRO SCREEN - Optimiert für iPhone */
        #intro-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('IMG_4340.jpeg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px; /* Puffer zu den Rändern */
            transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        /* Glühender Text - Passt sich der Bildschirmbreite an */
        #intro-screen h1 {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: clamp(2rem, 10vw, 3.5rem); /* Minimum 2rem, passt sich an bis 3.5rem */
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            width: 100%;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #58a6ff;
            animation: floatGlow 3s ease-in-out infinite;
        }

        /* Button - Jetzt besser klickbar auf Touchscreens */
        #enter-btn {
            padding: 18px 30px;
            font-size: 1rem;
            background: rgba(88, 166, 255, 0.2);
            color: white;
            border: 2px solid #58a6ff;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); /* Für Safari/iPhone */
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            -webkit-tap-highlight-color: transparent; /* Verhindert grauen Kasten beim Tippen */
        }

        #enter-btn:active {
            transform: scale(0.95);
            background: #58a6ff;
        }

        /* DOKU CONTENT - Schmaler für Hochformat */
        #main-content {
            display: none; /* Erst nach Klick da */
            opacity: 0;
            padding: 30px 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            transition: opacity 0.8s ease;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        h2 { font-size: 1.4rem; color: #58a6ff; margin-top: 0; }
        p { font-size: 1rem; line-height: 1.5; }

        @keyframes floatGlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden-intro {
            transform: translateY(-100%) !important;
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1>Dokumentation</h1>
        <button id="enter-btn">Meine Dokumentation</button>
    </div>

    <div id="main-content">
        <h1 style="text-align: center; color: #58a6ff; font-size: 1.8rem;">Foggy Fights</h1>
        
        <div class="card">
            <h2>Konzept</h2>
            <p>Design eines düsteren Gaming-Portals für das Projekt "Foggy Fights". Fokus: Atmosphäre und Mobile-Experience.</p>
        </div>

        <div class="card">
            <h2>Technik</h2>
            <p>Responsive Design mit <b>HTML5</b>, <b>CSS Flexbox</b> und <b>JavaScript</b> für die Interaktion.</p>
        </div>

        <div class="card" style="text-align: center;">
            <a href="#" style="color: #58a6ff; text-decoration: none; font-weight: bold; font-size: 1.1rem;">ZUM SPIEL →</a>
        </div>
    </div>

    <script>
        document.getElementById('enter-btn').addEventListener('click', function() {
            const intro = document.getElementById('intro-screen');
            const main = document.getElementById('main-content');
            
            intro.classList.add('hidden-intro');
            main.style.display = 'block';
            
            setTimeout(() => {
                main.style.opacity = '1';
                document.body.style.overflowY = 'auto';
            }, 100);
        });
    </script>
</body>
</html>
